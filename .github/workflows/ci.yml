name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff, error-level rules)
        run: ruff check .
      - name: Unit + integration tests (hermetic; no network, no LLM)
        run: pytest -q
      - name: Frontend build
        env:
          API_BASE_URL: https://example.invalid
        run: python frontend/build.py --out /tmp/site

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t takshashila-kb-api:ci .
