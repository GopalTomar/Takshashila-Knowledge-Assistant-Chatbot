# Build and deploy the public frontend (frontend/) to GitHub Pages.
# The backend URL comes from the repository VARIABLE API_BASE_URL
# (Settings → Secrets and variables → Actions → Variables). It is a public URL,
# not a secret; no secrets are ever written into the site.
# Only frontend/dist (HTML/CSS/JS/assets + config.js with the API URL) is published —
# never data/, backend code or credentials. The build uses the standard library only.
# Until API_BASE_URL is set (i.e. before the Render service exists) the deployment is
# skipped with a warning instead of failing.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  api-url-missing:
    if: vars.API_BASE_URL == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::Repository variable API_BASE_URL is not set (https://<render-service>.onrender.com) — Pages deployment skipped."

  build:
    if: vars.API_BASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: python frontend/build.py --out frontend/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
